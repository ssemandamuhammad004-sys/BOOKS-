<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Client Activity Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122B4F;
  --blue:#2A5DAD;
  --blue-dark:#1E4685;
  --blue-tint:#EEF3FB;
  --blue-tint-2:#E2ECFA;
  --paper:#FFFFFF;
  --floor:#F5F8FC;
  --line:#DFE7F1;
  --text:#1B2A41;
  --text-soft:#5C6E85;
  --text-faint:#8A99AE;
  --green:#1E8A5C;
  --green-tint:#E5F5EC;
  --amber:#C77D18;
  --amber-tint:#FBF0DF;
  --red:#C4432F;
  --red-tint:#FBE9E6;
  --shadow: 0 1px 2px rgba(18,43,79,.06), 0 6px 20px rgba(18,43,79,.06);
  --radius: 14px;
  --radius-sm: 10px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#EAF0FB; --blue:#6F9CE8; --blue-dark:#8FB4EF; --blue-tint:#132038; --blue-tint-2:#16294A;
    --paper:#0E1626; --floor:#0A101C; --line:#22314C; --text:#E8EEFA; --text-soft:#9AACC6; --text-faint:#6C7F9C;
    --green:#4FCF98; --green-tint:#0E2A22; --amber:#EAB05A; --amber-tint:#332309; --red:#F17361; --red-tint:#301612;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ink:#EAF0FB; --blue:#6F9CE8; --blue-dark:#8FB4EF; --blue-tint:#132038; --blue-tint-2:#16294A;
  --paper:#0E1626; --floor:#0A101C; --line:#22314C; --text:#E8EEFA; --text-soft:#9AACC6; --text-faint:#6C7F9C;
  --green:#4FCF98; --green-tint:#0E2A22; --amber:#EAB05A; --amber-tint:#332309; --red:#F17361; --red-tint:#301612;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--floor);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,.num,.brand,.tab-label,.stat-value{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--blue-tint-2);}

/* ---------- Layout shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--paper);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-weight:700;font-size:17px;color:var(--ink);}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--ink));flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;}
.nav-group{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text-soft);
  font-size:14px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;border:none;background:none;text-align:left;width:100%;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--blue-tint);color:var(--ink);}
.nav-item.active{background:var(--blue-tint-2);color:var(--blue-dark);font-weight:600;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;min-width:18px;text-align:center;}
.sidebar-foot{margin-top:auto;padding:10px 12px;font-size:12px;color:var(--text-faint);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 26px;
  border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:19px;margin:0;font-weight:600;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);position:relative;
}
.icon-btn:hover{background:var(--blue-tint);color:var(--blue-dark);}
.icon-btn svg{width:18px;height:18px;}
.hamburger{display:none;}
.dot-badge{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;transition:transform .1s, background .15s;white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-ghost{background:var(--blue-tint);color:var(--blue-dark);}
.btn-ghost:hover{background:var(--blue-tint-2);}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--text-soft);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue-dark);}
.btn-danger{background:var(--red-tint);color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn svg{width:15px;height:15px;}

.content{padding:22px 26px 90px;max-width:1320px;width:100%;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Cards / grid ---------- */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.stat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.stat-label{font-size:12.5px;color:var(--text-soft);font-weight:500;}
.stat-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-icon svg{width:16px;height:16px;}
.stat-value{font-size:25px;font-weight:700;color:var(--ink);line-height:1;}
.stat-sub{font-size:12px;color:var(--text-faint);margin-top:4px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:16px;margin:0;color:var(--ink);}
.section-sub{font-size:13px;color:var(--text-soft);margin-top:2px;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.empty{padding:46px 20px;text-align:center;color:var(--text-faint);}
.empty svg{width:40px;height:40px;margin-bottom:10px;opacity:.5;}
.empty div.t{font-weight:600;color:var(--text-soft);margin-bottom:4px;}

/* Activity row card (dashboard) */
.arow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
.arow:last-child{border-bottom:none;}
.arow-time{width:76px;flex-shrink:0;text-align:center;}
.arow-time .t1{font-weight:700;font-size:13.5px;color:var(--ink);}
.arow-time .t2{font-size:11px;color:var(--text-faint);}
.arow-main{flex:1;min-width:0;}
.arow-main .client{font-weight:600;font-size:14px;color:var(--ink);}
.arow-main .activity{font-size:13px;color:var(--text-soft);margin-top:1px;}
.arow-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.arow-amt{text-align:right;flex-shrink:0;min-width:100px;}
.arow-amt .amt{font-weight:700;font-size:13.5px;color:var(--ink);}
.arow-amt .bal{font-size:11.5px;color:var(--red);}
.arow-amt .bal.ok{color:var(--green);}
.arow-actions{display:flex;gap:6px;flex-shrink:0;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.dot::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-green{background:var(--green-tint);color:var(--green);}
.b-amber{background:var(--amber-tint);color:var(--amber);}
.b-red{background:var(--red-tint);color:var(--red);}
.b-blue{background:var(--blue-tint-2);color:var(--blue-dark);}
.b-grey{background:var(--floor);color:var(--text-soft);}

/* Table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px;}
thead th{text-align:left;font-size:11.5px;text-transform:none;color:var(--text-faint);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--floor);white-space:nowrap;}
tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--blue-tint);}
.cell-name{font-weight:600;color:var(--ink);}
.cell-sub{font-size:12px;color:var(--text-faint);}
.row-actions{display:flex;gap:5px;}
.mini-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);}
.mini-btn:hover{background:var(--blue-tint);color:var(--blue-dark);border-color:var(--blue);}
.mini-btn svg{width:14px;height:14px;}

/* Filters row */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px;}
.search-box input{width:100%;padding:10px 14px 10px 36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--text);}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-faint);}
select, .sel{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;color:var(--text);}
input,textarea,select{font-family:inherit;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-tint-2);}

/* Client cards */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.client-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s;}
.client-card:hover{border-color:var(--blue);}
.client-avatar{width:38px;height:38px;border-radius:10px;background:var(--blue-tint-2);color:var(--blue-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;margin-bottom:10px;}
.client-card .name{font-weight:600;font-size:14.5px;color:var(--ink);}
.client-card .meta{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
.client-card .stats{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.client-card .stats div{font-size:11.5px;color:var(--text-faint);}
.client-card .stats b{display:block;font-size:14px;color:var(--ink);font-family:'Space Grotesk';}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow-y:auto;backdrop-filter:blur(2px);}
.overlay.active{display:flex;}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);margin-bottom:5vh;}
.modal.wide{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-size:16px;color:var(--ink);}
.modal-close{width:32px;height:32px;border-radius:9px;border:none;background:var(--floor);color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.one{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:6px;}
.field.span2{grid-column:1/-1;}
.field label{font-size:12.5px;font-weight:600;color:var(--text-soft);}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--floor);font-size:13.5px;color:var(--text);}
.field textarea{resize:vertical;min-height:64px;}
.hint{font-size:11.5px;color:var(--text-faint);}
.reminder-opts{display:flex;flex-direction:column;gap:8px;}
.reminder-opts label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text);font-weight:400;cursor:pointer;}
.reminder-opts input{width:16px;height:16px;accent-color:var(--blue);}

/* Reminder card */
.reminder-card{border-left:3px solid var(--red);background:var(--red-tint);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.reminder-card.upcoming{border-left-color:var(--amber);background:var(--amber-tint);}
.reminder-card .rtitle{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--red);margin-bottom:6px;}
.reminder-card.upcoming .rtitle{color:var(--amber);}
.reminder-card .rclient{font-weight:600;color:var(--ink);font-size:14px;}
.reminder-card .ractivity{font-size:13px;color:var(--text-soft);}
.reminder-card .rmeta{font-size:12.5px;color:var(--text-faint);margin-top:4px;}
.reminder-card .rbadges{margin-top:8px;display:flex;gap:6px;}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.cal-nav{display:flex;align-items:center;gap:8px;}
.cal-title{font-weight:600;font-size:15px;color:var(--ink);min-width:150px;text-align:center;}
.cal-viewtabs{display:flex;gap:4px;background:var(--floor);border-radius:10px;padding:3px;}
.cal-viewtabs button{padding:7px 14px;border-radius:8px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;}
.cal-viewtabs button.active{background:var(--paper);color:var(--blue-dark);box-shadow:var(--shadow);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:11px;color:var(--text-faint);font-weight:600;padding:4px 0 8px;}
.cal-cell{background:var(--paper);border:1px solid var(--line);border-radius:10px;min-height:90px;padding:8px;cursor:pointer;transition:border-color .15s;}
.cal-cell:hover{border-color:var(--blue);}
.cal-cell.other{opacity:.4;}
.cal-cell.today{border-color:var(--blue);background:var(--blue-tint);}
.cal-daynum{font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:5px;}
.cal-cell.today .cal-daynum{color:var(--blue-dark);}
.cal-dots{display:flex;flex-direction:column;gap:3px;}
.cal-dotitem{font-size:10.5px;padding:2px 6px;border-radius:5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-week-row{display:flex;flex-direction:column;gap:10px;}
.cal-week-day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;}
.cal-week-day .wd-head{font-size:12.5px;font-weight:700;color:var(--text-soft);margin-bottom:8px;display:flex;justify-content:space-between;}
.cal-week-day.today .wd-head{color:var(--blue-dark);}

/* client profile */
.profile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.profile-id{display:flex;gap:14px;align-items:center;}
.profile-avatar{width:52px;height:52px;border-radius:14px;background:var(--blue-tint-2);color:var(--blue-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;}
.profile-name{font-size:19px;font-weight:700;color:var(--ink);}
.profile-meta{font-size:13px;color:var(--text-soft);margin-top:2px;}
.profile-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
.pstat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.pstat .l{font-size:11.5px;color:var(--text-faint);margin-bottom:4px;}
.pstat .v{font-size:18px;font-weight:700;color:var(--ink);}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* bottom nav (mobile) */
.bottom-nav{display:none;}

/* Reports */
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}

.mobile-only{display:none;}

@media (max-width:900px){
  .sidebar{display:none;}
  .content{padding:16px 14px 90px;}
  .topbar{padding:12px 14px;}
  .hamburger{display:flex;}
  .mobile-only{display:block;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);
    z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .bottom-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-faint);font-size:10.5px;padding:6px 4px;cursor:pointer;flex:1;min-width:0;}
  .bottom-nav button svg{width:19px;height:19px;}
  .bottom-nav button.active{color:var(--blue-dark);}
  .content{padding-bottom:80px;}
  .form-grid{grid-template-columns:1fr;}
  .arow{flex-wrap:wrap;}
  .arow-amt{text-align:left;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--paper);z-index:150;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.2);padding:22px 14px;overflow-y:auto;}
  .drawer.open{transform:translateX(0);}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:140;display:none;}
  .drawer-overlay.active{display:block;}
}
@media (min-width:901px){
  .drawer{display:none;}
}
</style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed;inset:0;background:var(--floor);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:500;">
  <div style="width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin 0.8s linear infinite;"></div>
  <div style="font-size:13.5px;color:var(--text-soft);font-weight:500;">Connecting to your data…</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<div class="shell">
  <!-- Desktop Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">CA</div>Client Activity Manager</div>
    <div class="nav-group" id="navGroup"></div>
    <div class="sidebar-foot" id="sidebarFoot">Saved to your server's database.</div>
  </nav>

  <!-- Mobile Drawer -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <div class="brand"><div class="brand-mark">CA</div>Client Activity Manager</div>
    <div class="nav-group" id="navGroupMobile"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        </button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="notifBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round"/></svg>

<script>
/* =========================================================
   DATA LAYER
========================================================= */
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }

let DB = {clients:[], activities:[], payments:[]};
let appStarted = false;
let pollTimer = null;

function showLoading(on){
  const el = document.getElementById('loadingOverlay');
  if(el) el.style.display = on ? 'flex' : 'none';
}

const API_BASE = '/api';
async function apiGet(path){
  const r = await fetch(API_BASE+path);
  if(!r.ok){ const body = await r.json().catch(()=>({})); throw new Error(body.error || r.statusText || ('HTTP '+r.status)); }
  return r.json();
}
async function apiSend(method, path, body){
  const opts = {method};
  if(body !== undefined){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const r = await fetch(API_BASE+path, opts);
  if(!r.ok){ const b = await r.json().catch(()=>({})); throw new Error(b.error || r.statusText || ('HTTP '+r.status)); }
  return r.json().catch(()=>({}));
}

async function loadAll(){
  const data = await apiGet('/all');
  DB.clients = data.clients || [];
  DB.activities = data.activities || [];
  DB.payments = data.payments || [];
}

async function initApp(){
  showLoading(true);
  try{
    await loadAll();
    appStarted = true;
    showLoading(false);
    goTo('dashboard');
    startPolling();
  }catch(e){
    showLoading(false);
    document.getElementById('pageTitle').textContent = 'Connection error';
    document.getElementById('content').innerHTML = connectionErrorHtml(e);
  }
}
function connectionErrorHtml(e){
  return `<div class="panel" style="padding:44px 24px;text-align:center;">
    <div style="font-weight:600;color:var(--ink);margin-bottom:8px;font-size:15px;">Can't reach the server</div>
    <div style="color:var(--text-soft);font-size:13.5px;margin-bottom:18px;">${escapeHtml(e.message||'Unknown error')}<br>Make sure the server is running (<code>npm start</code>) and reload this page.</div>
    <button class="btn btn-primary" onclick="location.reload()">Reload</button>
  </div>`;
}
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  // Light polling keeps multiple open tabs/devices roughly in sync without
  // needing websockets. Failures here are transient network blips, so we
  // just skip that cycle rather than surface an error.
  pollTimer = setInterval(async ()=>{
    try{ await loadAll(); renderView(); }catch(e){ /* ignore transient poll errors */ }
  }, 15000);
}

/* Write helpers: every mutation goes straight to the server's REST API,
   then reloads the local cache from it so the UI always reflects what is
   actually saved in the SQLite database. */
async function dbAdd(collection, data){
  const res = await apiSend('POST', '/'+collection, data);
  await loadAll(); renderView();
  return {id: res.id};
}
async function dbSet(collection, id, data){
  await apiSend('PUT', '/'+collection+'/'+id, data);
  await loadAll(); renderView();
}
async function dbUpdate(collection, id, data){
  await apiSend('PATCH', '/'+collection+'/'+id, data);
  await loadAll(); renderView();
}
async function dbDelete(collection, id){
  await apiSend('DELETE', '/'+collection+'/'+id);
  await loadAll(); renderView();
}
async function dbDeleteAll(collection){
  await apiSend('DELETE', '/'+collection);
  await loadAll(); renderView();
}
function dbErrorMessage(e){
  return (e && e.message) || 'Something went wrong while saving.';
}

/* =========================================================
   UTIL
========================================================= */
function money(n){ n = Number(n)||0; return 'UGX ' + n.toLocaleString('en-UG',{maximumFractionDigits:0}); }
function balanceOf(a){ return Math.max(0, (Number(a.amount)||0) - (Number(a.amount_paid)||0)); }
function paymentStatusOf(a){
  const amt = Number(a.amount)||0, paid = Number(a.amount_paid)||0;
  if(paid <= 0) return 'Unpaid';
  if(paid >= amt) return 'Paid';
  return 'Partially Paid';
}
function isOverdue(a){
  if(!a.deadline) return false;
  if(a.submission_status === 'Submitted') return false;
  return new Date(a.deadline).getTime() < Date.now();
}
function submissionDisplay(a){
  if(isOverdue(a) && a.submission_status !== 'Late Submission') return 'Overdue';
  return a.submission_status;
}
function badgeForSubmission(status){
  const map = {'Not Started':'b-grey','In Progress':'b-blue','Submitted':'b-green','Late Submission':'b-amber','Overdue':'b-red'};
  return map[status] || 'b-grey';
}
function badgeForPayment(status){
  const map = {'Unpaid':'b-red','Partially Paid':'b-amber','Paid':'b-green'};
  return map[status] || 'b-grey';
}
function clientById(id){ return DB.clients.find(c=>c.id===id); }
function activitiesOf(clientId){ return DB.activities.filter(a=>a.client_id===clientId); }
function paymentsOf(activityId){ return DB.payments.filter(p=>p.activity_id===activityId); }
function fmtTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12?'PM':'AM'; let hh = h%12; if(hh===0) hh=12;
  return `${hh}:${String(m).padStart(2,'0')} ${ap}`;
}
function fmtDateHuman(dstr){
  if(!dstr) return '';
  const d = new Date(dstr+'T00:00:00');
  const opts = {weekday:'short', day:'numeric', month:'short'};
  const today = todayStr();
  if(dstr === today) return 'Today';
  if(dstr === addDays(today,1)) return 'Tomorrow';
  if(dstr === addDays(today,-1)) return 'Yesterday';
  return d.toLocaleDateString('en-GB', opts);
}
function initials(name){ return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================

  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>',

  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v13m0 0l-4.5-4.5M12 16l4.5-4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 19h16" stroke-linecap="round"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke-linecap="round"/></svg>',

/* =========================================================
   NAVIGATION
========================================================= */
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard'},
  {id:'clients', label:'Clients', icon:'clients'},
  {id:'activities', label:'Activities', icon:'activities'},
  {id:'calendar', label:'Calendar', icon:'calendar'},
  {id:'payments', label:'Payments', icon:'payments'},
  {id:'reminders', label:'Reminders', icon:'reminders'},
  {id:'reports', label:'Reports', icon:'reports'},
  {id:'settings', label:'Settings', icon:'settings'},
];
let currentView = 'dashboard';
let currentClientProfile = null;

function renderNav(){
  const overdueCount = DB.activities.filter(a=>isOverdue(a)).length;
  function itemHtml(n){
    const badge = n.id==='reminders' && overdueCount>0 ? `<span class="nav-badge">${overdueCount}</span>` : '';
    return `<button class="nav-item ${currentView===n.id?'active':''}" data-nav="${n.id}">${ICONS[n.icon]}<span>${n.label}</span>${badge}</button>`;
  }
  document.getElementById('navGroup').innerHTML = NAV.map(itemHtml).join('');
  document.getElementById('navGroupMobile').innerHTML = NAV.map(itemHtml).join('');
  const foot = document.getElementById('sidebarFoot');
  if(foot) foot.textContent = appStarted ? "Saved to your server's database." : 'Connecting…';
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=>{ goTo(b.dataset.nav); closeDrawer(); }));

  // bottom nav: primary 5
  const bnItems = ['dashboard','activities','calendar','reminders','reports'];
  document.getElementById('bottomNav').innerHTML = bnItems.map(id=>{
    const n = NAV.find(x=>x.id===id);
    const badge = id==='reminders' && overdueCount>0 ? `<span class="dot-badge" style="position:absolute;top:2px;right:14px;">${overdueCount>9?'9+':overdueCount}</span>` : '';
    return `<button class="${currentView===id?'active':''}" data-nav="${id}" style="position:relative;">${ICONS[n.icon]}<span>${n.label}</span>${badge}</button>`;
  }).join('') + `<button data-nav="clients" class="${currentView==='clients'?'active':''}">${ICONS.clients}<span>Clients</span></button>`;
  document.querySelectorAll('#bottomNav [data-nav]').forEach(b=>b.addEventListener('click', ()=>goTo(b.dataset.nav)));
}

function goTo(view){
  currentView = view;
  currentClientProfile = null;
  document.getElementById('pageTitle').textContent = NAV.find(n=>n.id===view)?.label || 'Client Activity Manager';
  document.getElementById('addActivityBtn').style.display = (view==='dashboard'||view==='activities'||view==='calendar') ? 'inline-flex' : 'none';
  renderNav();
  renderView();
  window.scrollTo({top:0, behavior:'smooth'});
}

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('drawerOverlay').classList.add('active'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('active'); }
document.getElementById('hamburgerBtn').addEventListener('click', openDrawer);
document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

/* =========================================================
   MODALS
========================================================= */
function openModal(id){ document.getElementById(id).classList.add('active'); }
function closeModal(id){ document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeModal(b.dataset.close)));
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click', (e)=>{ if(e.target===o) o.classList.remove('active'); }));

/* =========================================================
   RENDER: MAIN DISPATCH
========================================================= */
function renderView(){
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = viewDashboard();
  else if(currentView==='clients') c.innerHTML = currentClientProfile ? viewClientProfile(currentClientProfile) : viewClients();
  else if(currentView==='activities') c.innerHTML = viewActivities();
  else if(currentView==='calendar') c.innerHTML = viewCalendar();
  else if(currentView==='payments') c.innerHTML = viewPayments();
  else if(currentView==='reminders') c.innerHTML = viewReminders();
  else if(currentView==='reports') c.innerHTML = viewReports();
  else if(currentView==='settings') c.innerHTML = viewSettings();
  bindViewEvents();
  updateNotifBadge();
}

/* =========================================================
   DASHBOARD
========================================================= */
function computeStats(){
  const acts = DB.activities;
  const today = todayStr();
  const totalClients = DB.clients.length;
  const totalActivities = acts.length;
  const activitiesToday = acts.filter(a=>a.activity_date===today).length;
  const pendingSubmissions = acts.filter(a=>['Not Started','In Progress'].includes(a.submission_status) && !isOverdue(a)).length;
  const overdue = acts.filter(a=>isOverdue(a)).length;
  const paid = acts.filter(a=>paymentStatusOf(a)==='Paid').length;
  const unpaid = acts.filter(a=>paymentStatusOf(a)==='Unpaid').length;
  const totalPaid = acts.reduce((s,a)=>s+(Number(a.amount_paid)||0),0);
  const totalOutstanding = acts.reduce((s,a)=>s+balanceOf(a),0);
  return {totalClients,totalActivities,activitiesToday,pendingSubmissions,overdue,paid,unpaid,totalPaid,totalOutstanding};
}

function statCard(label, value, iconKey, tint, sub){

let calView = 'month';

function viewCalendar(){
  const head = `

        <button data-calview="day" class="${calView==='day'?'active':''}">Day</button>
      </div>
    </div>`;
  let body = '';
  if(calView==='month') body = renderCalMonth();
  else if(calView==='week') body = renderCalWeek();
  else body = renderCalDay();
  return head + body;
}
function calDotClass(a){
  const sub = submissionDisplay(a);
  if(sub==='Overdue') return 'b-red';
  if(sub==='Submitted') return 'b-green';
  const pay = paymentStatusOf(a);
  if(pay==='Unpaid') return 'b-red';
  if(pay==='Partially Paid') return 'b-amber';
  return 'b-blue';
}
function renderCalMonth(){
  const anchor = calAnchor;
  const year = anchor.getFullYear(), month = anchor.getMonth();
  document.title = document.title; // noop
  const monthName = anchor.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){ const d = new Date(year, month, 1-(startOffset-i)); cells.push({date:d, other:true}); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({date:new Date(year,month,d), other:false}); }
  while(cells.length % 7 !== 0 || cells.length < 35){ const last = cells[cells.length-1].date; const nd = new Date(last); nd.setDate(nd.getDate()+1); cells.push({date:nd, other:true}); }
  setTimeout(()=>{ const el = document.getElementById('calTitle'); if(el) el.textContent = monthName; },0);
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today = todayStr();
  let html = `<div class="cal-grid">` + dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  cells.forEach(cell=>{
    const dstr = fmtDate(cell.date);
    const dayActs = DB.activities.filter(a=>a.activity_date===dstr).sort((a,b)=>a.start_time.localeCompare(b.start_time));
    const isToday = dstr===today;
    html += `<div class="cal-cell ${cell.other?'other':''} ${isToday?'today':''}" data-cal-day="${dstr}">
      <div class="cal-daynum">${cell.date.getDate()}</div>
      <div class="cal-dots">
        ${dayActs.slice(0,3).map(a=>`<div class="cal-dotitem ${calDotClass(a)}" style="background:var(--floor);">${escapeHtml(clientById(a.client_id)?.name.split(' ')[0]||'')} · ${escapeHtml(a.activity_name)}</div>`).join('')}
        ${dayActs.length>3?`<div class="cal-dotitem" style="color:var(--text-faint);">+${dayActs.length-3} more</div>`:''}
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}
function renderCalWeek(){
  const anchor = calAnchor;
  const start = new Date(anchor); start.setDate(start.getDate() - start.getDay());
  const days = Array.from({length:7}, (_,i)=>{ const d = new Date(start); d.setDate(d.getDate()+i); return d; });
  setTimeout(()=>{ const el = document.getElementById('calTitle'); if(el) el.textContent = `${days[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${days[6].toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`; },0);
  const today = todayStr();
  return `<div class="cal-week-row">` + days.map(d=>{
    const dstr = fmtDate(d);
    const acts = DB.activities.filter(a=>a.activity_date===dstr).sort((a,b)=>a.start_time.localeCompare(b.start_time));
    return `<div class="cal-week-day ${dstr===today?'today':''}" data-cal-day="${dstr}">
      <div class="wd-head"><span>${d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'})}</span><span>${acts.length} activity${acts.length!==1?'ies':''}</span></div>
      ${acts.length? acts.map(a=>activityRowHtml(a)).join('') : `<div style="font-size:12.5px;color:var(--text-faint);">No activities</div>`}
    </div>`;
  }).join('') + `</div>`;
}
function renderCalDay(){
  const dstr = fmtDate(calAnchor);
  setTimeout(()=>{ const el = document.getElementById('calTitle'); if(el) el.textContent = calAnchor.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'}); },0);
  const acts = DB.activities.filter(a=>a.activity_date===dstr).sort((a,b)=>a.start_time.localeCompare(b.start_time));
  return `<div class="panel">${acts.length? acts.map(a=>activityRowHtml(a)).join('') : emptyState('No activities this day', 'Add one and it will show up here.')}</div>`;

/* =========================================================
   REMINDERS
========================================================= */
function reminderList(){
  const now = Date.now();
  const items = [];
  DB.activities.forEach(a=>{
    const c = clientById(a.client_id);
    if(!c) return;
    const overdue = isOverdue(a);
    const startDT = new Date(a.activity_date+'T'+(a.start_time||'00:00'));
    const deadlineDT = a.deadline ? new Date(a.deadline) : null;
    const hoursToStart = (startDT - now)/3600000;
    const settings = a.reminder_settings || [];
    if(overdue){
      items.push({a,c, kind:'urgent', title:'OVERDUE — NOT SUBMITTED', order:0});
    } else if(settings.includes('after_deadline') && deadlineDT && deadlineDT.getTime() < now && a.submission_status !== 'Submitted'){
      items.push({a,c, kind:'urgent', title:'PAST DEADLINE', order:0});
    } else if(settings.includes('1_day_before') && hoursToStart>0 && hoursToStart<=24){
      items.push({a,c, kind:'upcoming', title:'STARTS WITHIN 1 DAY', order:1});
    } else if(settings.includes('3_hours_before') && hoursToStart>0 && hoursToStart<=3){
      items.push({a,c, kind:'upcoming', title:'STARTS WITHIN 3 HOURS', order:1});
    } else if(settings.includes('1_hour_before_deadline') && deadlineDT && (deadlineDT-now)/3600000<=1 && (deadlineDT-now)>0){
      items.push({a,c, kind:'upcoming', title:'DEADLINE WITHIN 1 HOUR', order:1});
    } else if(settings.includes('at_deadline') && deadlineDT && Math.abs(deadlineDT-now)/3600000<=1){
      items.push({a,c, kind:'upcoming', title:'DEADLINE TODAY', order:1});
    }
    if(paymentStatusOf(a)==='Unpaid' || paymentStatusOf(a)==='Partially Paid'){
      items.push({a,c, kind:'upcoming', title: paymentStatusOf(a)==='Unpaid' ? 'PAYMENT OUTSTANDING' : 'PARTIAL PAYMENT OUTSTANDING', order:2, isPayment:true});
    }
  });
  // de-dup by activity+title
  const seen = new Set(); const out = [];
  items.sort((x,y)=>x.order-y.order).forEach(it=>{ const k=it.a.id+it.title; if(!seen.has(k)){seen.add(k); out.push(it);} });
  return out;
}
function viewReminders(){
  const items = reminderList();
  const urgent = items.filter(i=>i.kind==='urgent');
  const upcoming = items.filter(i=>i.kind==='upcoming');
  function card(it){
    const a = it.a, c = it.c;
    return `<div class="reminder-card ${it.kind==='upcoming'?'upcoming':''}" data-activity="${a.id}">
      <div class="rtitle">${it.title}</div>
      <div class="rclient">${escapeHtml(c.name)}</div>
      <div class="ractivity">${escapeHtml(a.activity_name)}</div>

      <div class="rbadges">
        <span class="badge dot ${badgeForSubmission(submissionDisplay(a))}">${submissionDisplay(a)}</span>
        <span class="badge dot ${badgeForPayment(paymentStatusOf(a))}">${paymentStatusOf(a)}</span>

  }
  return `
    <div class="section-head"><div><h2>Needs attention now</h2><div class="section-sub">${urgent.length} item${urgent.length!==1?'s':''}</div></div></div>
    ${urgent.length ? urgent.map(card).join('') : `<div class="panel">${emptyState('Nothing overdue', 'Great — everything is on track.')}</div>`}

}

/* =========================================================
   REPORTS
========================================================= */
let reportRange = 'month';
let reportCustomStart = todayStr(), reportCustomEnd = todayStr();
function activitiesInRange(){
  const today = todayStr();
  let start, end;
  if(reportRange==='today'){ start = today; end = today; }
  else if(reportRange==='week'){ const d = new Date(); const day = d.getDay(); start = addDays(today, -day); end = addDays(start,6); }
  else if(reportRange==='month'){ const d = new Date(); start = fmtDate(new Date(d.getFullYear(), d.getMonth(),1)); end = fmtDate(new Date(d.getFullYear(), d.getMonth()+1,0)); }
  else { start = reportCustomStart; end = reportCustomEnd; }
  return DB.activities.filter(a=>a.activity_date>=start && a.activity_date<=end);
}
function viewReports(){
  const list = activitiesInRange();
  const total = list.length;
  const completed = list.filter(a=>a.submission_status==='Submitted').length;
  const pending = list.filter(a=>['Not Started','In Progress'].includes(a.submission_status) && !isOverdue(a)).length;
  const overdue = list.filter(a=>isOverdue(a)).length;
  const charged = list.reduce((s,a)=>s+(Number(a.amount)||0),0);
  const received = list.reduce((s,a)=>s+(Number(a.amount_paid)||0),0);
  const unpaidBal = list.reduce((s,a)=>s+balanceOf(a),0);
  return `
    <div class="filters">
      <select id="reportRangeSel">
        <option value="today" ${reportRange==='today'?'selected':''}>Today</option>
        <option value="week" ${reportRange==='week'?'selected':''}>This week</option>
        <option value="month" ${reportRange==='month'?'selected':''}>This month</option>
        <option value="custom" ${reportRange==='custom'?'selected':''}>Custom range</option>
      </select>
      ${reportRange==='custom' ? `<input type="date" id="reportStart" value="${reportCustomStart}"> <input type="date" id="reportEnd" value="${reportCustomEnd}">` : ''}
      <button class="btn btn-ghost" id="exportCsvBtn">${ICONS.download} Export CSV</button>
    </div>
    <div class="report-grid">
      ${statCard('Total activities', total, 'activities', {bg:'var(--blue-tint-2)',fg:'var(--blue-dark)'})}
      ${statCard('Completed', completed, 'check', {bg:'var(--green-tint)',fg:'var(--green)'})}
      ${statCard('Pending', pending, 'reminders', {bg:'var(--amber-tint)',fg:'var(--amber)'})}
      ${statCard('Overdue', overdue, 'reminders', {bg:'var(--red-tint)',fg:'var(--red)'})}
      ${statCard('Amount charged', money(charged), 'cash', {bg:'var(--blue-tint-2)',fg:'var(--blue-dark)'})}
      ${statCard('Amount received', money(received), 'cash', {bg:'var(--green-tint)',fg:'var(--green)'})}
      ${statCard('Unpaid balance', money(unpaidBal), 'cash', {bg:'var(--red-tint)',fg:'var(--red)'})}
    </div>
    <div class="section-head"><h2>Activities in range</h2></div>
    <div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Client</th><th>Activity</th><th>Date</th><th>Submission</th><th>Payment</th><th>Amount</th><th>Balance</th></tr></thead>
      <tbody>${list.length ? list.map(a=>{const c=clientById(a.client_id); return `<tr><td class="cell-name">${escapeHtml(c?.name||'—')}</td><td>${escapeHtml(a.activity_name)}</td><td>${fmtDateHuman(a.activity_date)}</td><td><span class="badge dot ${badgeForSubmission(submissionDisplay(a))}">${submissionDisplay(a)}</span></td><td><span class="badge dot ${badgeForPayment(paymentStatusOf(a))}">${paymentStatusOf(a)}</span></td><td>${money(a.amount)}</td><td>${money(balanceOf(a))}</td></tr>`;}).join('') : `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--text-faint);">No activities in this range.</td></tr>`}</tbody>
    </table></div></div>
  `;
}
function exportCsv(){
  const list = activitiesInRange();
  const header = ['Client','Activity','Date','Start','End','Submission Status','Payment Status','Amount Charged','Amount Paid','Balance'];
  const lines = [header.join(',')];
  list.forEach(a=>{
    const c = clientById(a.client_id);
    const row = [c?.name||'', a.activity_name, a.activity_date, a.start_time, a.end_time, submissionDisplay(a), paymentStatusOf(a), a.amount, a.amount_paid, balanceOf(a)]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`);
    lines.push(row.join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = `activity_report_${todayStr()}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast('CSV exported');
}

document.getElementById('saveClientBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('c_name').value.trim();
  const phone = document.getElementById('c_phone').value.trim();
  if(!name || !phone){ toast('Name and phone are required'); return; }
  const id = document.getElementById('clientId').value;

  try{
    if(id){
      const existing = clientById(id) || {};
      const payload = {name, phone, email:document.getElementById('c_email').value.trim(), institution:document.getElementById('c_institution').value.trim(), notes:document.getElementById('c_notes').value.trim(), created_at:existing.created_at||todayStr()};

      toast('Client added');

  }catch(e){ toast(dbErrorMessage(e)); }
  btn.disabled = false;

async function deleteClient(id){
  if(!confirm('Delete this client and all their activities? This cannot be undone.')) return;
  try{
    for(const a of activitiesOf(id)){
      for(const p of paymentsOf(a.id)){ await dbDelete('payments', p.id); }
      await dbDelete('activities', a.id);
    }
    await dbDelete('clients', id);
    currentClientProfile = null;
    toast('Client deleted');
    renderView();
  }catch(e){ toast(dbErrorMessage(e)); }
}

  document.querySelectorAll('[data-calview]').forEach(b=>b.addEventListener('click', ()=>{ calView = b.dataset.calview; renderView(); }));
  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.addEventListener('click', ()=>{ shiftCal(-1); renderView(); });
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.addEventListener('click', ()=>{ shiftCal(1); renderView(); });

  const reportStart = document.getElementById('reportStart');

function preserveFocus(el){ setTimeout(()=>{ const fresh = document.getElementById(el.id); if(fresh){ fresh.focus(); const v=fresh.value; fresh.value=''; fresh.value=v; } },0); }
function shiftCal(dir){
  const d = new Date(calAnchor);
  if(calView==='month') d.setMonth(d.getMonth()+dir);
  else if(calView==='week') d.setDate(d.getDate()+7*dir);
  else d.setDate(d.getDate()+dir);
  calAnchor = d;
}

document.getElementById('addActivityBtn').addEventListener('click', openAddActivity);

/* =========================================================
   INIT
========================================================= */
initApp();
</script>
</body>
